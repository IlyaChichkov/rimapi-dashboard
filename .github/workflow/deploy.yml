name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # Add timeout to prevent stuck jobs
    timeout-minutes: 15
    
    runs-on: ubuntu-latest
    
    # Only deploy from main/master, not PRs
    if: github.event_name == 'push'
    
    # Add permissions for GitHub Pages
    permissions:
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    
    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest
    
    - name: Install dependencies
      run: bun install
    
    - name: Build
      run: bun run build
    
    - name: Setup Pages
      uses: actions/configure-pages@v3  # Updated to v3
    
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v2  # Updated to v2
      with:
        path: ./build
    
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v2  # Updated to v2